name: TMT Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      plan_filter:
        description: Test plan filter, for example tag:smoke.
        required: false
        default: ''
      use_built_from_src:
        description: Build bootupd from source instead of installing a distribution package.
        required: false
        default: 'true'

permissions:
  contents: read

# don't waste job slots on superseded code
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tmt-tests:
    runs-on: ubuntu-24.04
    container:
      image: fedora:latest
    env:
      PLAN_FILTER: ${{ github.event.inputs.plan_filter }}
      USE_BUILT_FROM_SRC: ${{ github.event.inputs.use_built_from_src || 'true' }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install dependencies
        run: dnf -y install git cargo rust openssl-devel pkgconf-pkg-config tmt

      - name: Build bootupd
        if: env.USE_BUILT_FROM_SRC == 'true'
        run: cargo build --release

      - name: Run TMT tests
        shell: bash
        run: |
          set -xeuo pipefail
          TMT_CMD=(tmt --feeling-safe)
          TMT_CMD+=(--context "use_built_from_src=${USE_BUILT_FROM_SRC}")
          TMT_CMD+=(run --all --debug -vvv)
          if [[ -n "${PLAN_FILTER}" ]]; then
            TMT_CMD+=(plan --filter "${PLAN_FILTER}")
          fi
          TMT_CMD+=(provision --how local)
          "${TMT_CMD[@]}"
